<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Minecraft Mob Details</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      rel="stylesheet"
      href="https://unpkg.com/@picocss/pico@2/css/pico.min.css"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="hero">
      <div class="hero-content">
        <h1>Minecraft Mobs</h1>
        <a href="/" class="home-link">Home</a>
      </div>
    </header>

    <main class="container">
      <article id="mob-article" class="mob-card">
        <img id="mob-image" class="mob-hero" alt="Mob image" />
        <h1 id="mob-name"></h1>
        <p id="mob-desc"></p>
        <div class="grid">
          <div>
            <h4>Type</h4>
            <p id="mob-type"></p>
          </div>
          <div>
            <h4>Biome</h4>
            <p id="mob-biome"></p>
          </div>
          <div>
            <h4>Drops</h4>
            <p id="mob-drops"></p>
          </div>
        </div>
        <a href="/" role="button" class="back-btn">Back to list</a>
      </article>
    </main>

    <script src="/scripts/mob.js"></script>
  </body>
</html>
